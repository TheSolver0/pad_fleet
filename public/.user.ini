; Lu automatiquement par PHP-FPM/Apache pour ce répertoire (public/), sans
; nécessiter de modifier le php.ini global du serveur. Les formulaires de
; documents/photos de l'app valident jusqu'à 10-15 Mo par fichier : ces
; limites doivent être au moins aussi hautes, sinon PHP rejette l'upload
; avant même que Laravel ne le voie ("l'upload ne prend pas").
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 20
max_execution_time = 120
memory_limit = 256M
